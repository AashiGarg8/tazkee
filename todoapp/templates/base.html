<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Taskzee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>

    {% comment %} <nav class="navbar bg-primary">
        <div class="container">
            <a href="" class="navbar-brand fw-bold"> ToDo App </a>
        </div>

        <div>
          {% if user.is_authenticated %}
          <span class="text-white me-3">Hi, {{user.username}}</span>

          <form action="{% url 'logout' %}" method="POST" style="display: inline;">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger btn-sm btn-custom">Logout</button>
          </form>
          
          {% endif %}
        </div>
    </nav> {% endcomment %}
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">

        <!-- Logo -->
        <a href="#" class="navbar-brand fw-bold">Taskzee</a>

        <!-- User Section -->
        {% if user.is_authenticated %}
        <div class="d-flex align-items-center">

            <span class="text-white me-3 fw-semibold">
                Hi, {{ user.username }}
            </span>

            <form action="{% url 'logout' %}" method="POST">
                {% csrf_token %}
                <button type="submit" class="btn btn-light btn-sm">
                    Logout
                </button>
            </form>

        </div>
        {% endif %}

    </div>
</nav>

    <div class="container mt-5">
        {% block content %}
        {% endblock %}
    </div>
    <style>
:root {
    --page-grad-1: #a9c4db;
    --page-grad-2: #c7d2e7;
    --page-grad-3: #d8cdea;
    --ink-900: #1f2430;
    --ink-700: #344058;
    --brand-700: #486b9d;
    --brand-600: #5b7aae;
    --brand-500: #6d8cc0;
    --soft-border: #bfd0e4;
}

body {
    min-height: 100vh;
    color: var(--ink-900);
    background: #ffffff;
}

.navbar {
    padding: 12px 0;
}

.navbar.bg-primary {
    background-color: var(--brand-700) !important;
}

.navbar-brand {
    font-size: 22px;
}

.container .card,
.main-card,
.task-card {
    background: rgba(255, 255, 255, 0.93) !important;
    border: 1px solid var(--soft-border);
    box-shadow: 0 10px 28px rgba(47, 64, 92, 0.13) !important;
    backdrop-filter: blur(2px);
}

.btn-primary,
.btn-success {
    border: none;
    background: linear-gradient(135deg, var(--brand-700), var(--brand-500));
}

.btn-primary:hover,
.btn-success:hover {
    background: linear-gradient(135deg, #3e5e8a, var(--brand-600));
}

.btn-outline-primary {
    color: var(--brand-700);
    border-color: var(--brand-700);
}

.btn-outline-primary:hover {
    background: var(--brand-700);
    border-color: var(--brand-700);
}

.form-control,
.form-select {
    border-color: var(--soft-border);
}

.form-control:focus,
.form-select:focus {
    border-color: var(--brand-600);
    box-shadow: 0 0 0 0.2rem rgba(91, 122, 174, 0.2);
}

.btn-light {
    font-weight: 500;
}

.splash-page {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(120deg, var(--page-grad-1) 0%, var(--page-grad-2) 50%, var(--page-grad-3) 100%);
}

.splash-content {
    display: flex;
    align-items: center;
    gap: 20px;
}

.splash-title {
    margin: 0;
    font-size: clamp(2.1rem, 4.5vw, 3.2rem);
    font-weight: 800;
    color: var(--ink-900);
    letter-spacing: 0.4px;
}

.splash-icon {
    width: 150px;
    max-width: 30vw;
    height: auto;
    display: block;
}

@media (max-width: 576px) {
    .splash-content {
        gap: 14px;
    }
    .splash-icon {
        width: 110px;
        max-width: 36vw;
    }
}
</style>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
